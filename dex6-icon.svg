<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="c9Bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#091e34"/>
      <stop offset="55%" stop-color="#050d1a"/>
      <stop offset="100%" stop-color="#02050b"/>
    </radialGradient>
    <linearGradient id="solGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="48%" stop-color="#14F195"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="goldCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="carbonArmor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f243c"/>
      <stop offset="50%" stop-color="#071222"/>
      <stop offset="100%" stop-color="#030811"/>
    </linearGradient>
    <filter id="c9Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Forged-Carbon Rounded App Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#c9Bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="url(#solGrad)" stroke-width="6" opacity="0.85"/>
  <!-- 9-Layer Radar Ring Behind Hex Crest -->
  <circle cx="256" cy="246" r="206" fill="none" stroke="#00D4FF" stroke-width="2" stroke-dasharray="10 8" opacity="0.45"/>
  <circle cx="256" cy="246" r="184" fill="none" stroke="#14F195" stroke-width="2.5" opacity="0.35"/>
  <!-- 9 Perimeter Radar Nodes -->
  <circle cx="256" cy="40" r="6" fill="#14F195"/>
  <circle cx="388" cy="88" r="6" fill="#00D4FF"/>
  <circle cx="458" cy="210" r="6" fill="#9945FF"/>
  <circle cx="434" cy="348" r="6" fill="#14F195"/>
  <circle cx="326" cy="438" r="6" fill="#fde047"/>
  <circle cx="186" cy="438" r="6" fill="#fde047"/>
  <circle cx="78" cy="348" r="6" fill="#14F195"/>
  <circle cx="54" cy="210" r="6" fill="#9945FF"/>
  <circle cx="124" cy="88" r="6" fill="#00D4FF"/>
  <!-- Forged-Carbon Hexagonal Cyber Shield -->
  <path d="M256 44 L434 114 L434 256 C434 366 356 442 256 474 C156 442 78 366 78 256 L78 114 Z"
        fill="url(#carbonArmor)" stroke="url(#solGrad)" stroke-width="15" filter="url(#c9Glow)"/>
  <path d="M256 72 L406 130 L406 252 C406 344 340 410 256 440 C172 410 106 344 106 252 L106 130 Z"
        fill="#040b16" stroke="url(#goldCore)" stroke-width="4.5" opacity="0.92"/>
  <!-- Golden Solana 3-Bar Core Emblem at Top of Shield -->
  <g transform="translate(206, 98)">
    <polygon points="12,0 100,0 88,12 0,12" fill="url(#solGrad)"/>
    <polygon points="0,20 88,20 100,32 12,32" fill="url(#goldCore)"/>
    <polygon points="12,40 100,40 88,52 0,52" fill="url(#solGrad)"/>
  </g>
  <!-- High-Contrast Institutional Typography -->
  <text x="256" y="224" text-anchor="middle" fill="#ffffff" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="76" letter-spacing="4">SOL</text>
  <text x="256" y="278" text-anchor="middle" fill="#6ee7b7" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="38" letter-spacing="2">RENT • BURN</text>
  <!-- Gold & Emerald Shield Banner -->
  <rect x="128" y="298" width="256" height="54" rx="14" fill="url(#solGrad)"/>
  <rect x="132" y="302" width="248" height="46" rx="11" fill="#03121a"/>
  <text x="256" y="334" text-anchor="middle" fill="url(#goldCore)" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="34" letter-spacing="3">🛡️ SHIELD</text>
  <text x="256" y="394" text-anchor="middle" fill="#38bdf8" font-family="Arial Black, sans-serif" font-weight="900" font-size="22" letter-spacing="2.5">CARBON-9 AI</text>
</svg>