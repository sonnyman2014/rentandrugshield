      new_in_version: Standalone v6.0 6-screen native release with cached MWA v2.0 multi-wallet auth, Camera QR scanner, 1m/3m/5m/15m MACD radar, Phone Cyber Shield, 30% Partner Vault, and 100%-175% font zoom.
