<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Rent &amp; Rug Shield Original Gold &amp; Black v5.7</title>
<style>
  :root { --rrs-scale: 1; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html, body { min-width: 380px; background: #060A14; color: #FFFFFF; overflow-x: hidden; zoom: var(--rrs-scale); }
  .wrap {
    padding: 12px 14px;
    background: #060A14;
    border: 2px solid #FFD000;
    border-radius: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .scan-row { display: flex; gap: 6px; width: 100%; }
  .scan-inp { flex: 1; background: #03060C; color: #FFF; border: 1.4px solid #FFD000; border-radius: 7px; padding: 6px 9px; font-size: 11.5px; font-weight: 700; outline: none; }
  .scan-btn { background: #FFD000; color: #060A14; border: none; border-radius: 7px; padding: 6px 11px; font-size: 11px; font-weight: 900; cursor: pointer; }
  .cbtn { background: #0B1222; color: #FFD000; border: 1.3px solid #FFD000; border-radius: 7px; padding: 4px 8px; font-size: 10.8px; font-weight: 900; cursor: pointer; }
  .ttl { font-size: 14px; font-weight: 900; color: #FFD000; cursor: pointer; }
  .sub { font-size: 11.8px; font-weight: 600; color: #E2E8F0; cursor: pointer; }
  .ftr { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,208,0,0.25); padding-top: 5px; font-size: 10.5px; font-weight: 800; }
</style>
</head>
<body>
  <div id="card" class="wrap">
    <div class="scan-row">
      <input id="ctScanInp" class="scan-inp" type="text" placeholder="Paste Coin Mint or Wallet Address Here..." />
      <button id="ctScanBtn" class="scan-btn" type="button">SCAN NOW</button>
    </div>
    <div id="ctScanOut" style="display:none;padding:6px 8px;border:1px solid #FFD000;border-radius:7px;font-size:10.5px;"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
      <span id="pl" style="color:#00FFA3;font-size:10.5px;font-weight:900;">GOLD &amp; BLACK v5.7</span>
      <div style="display:flex;gap:4px;">
        <button id="btnZoomOut" class="cbtn" type="button">- ZOOM</button>
        <button id="btnZoomPct" class="cbtn" type="button">100%</button>
        <button id="btnZoomIn" class="cbtn" type="button">+ ZOOM</button>
        <button id="btnPin" class="cbtn" type="button">10s / PIN</button>
        <button id="btnClose" class="cbtn" type="button" style="border-color:#FF4D6D;color:#FF4D6D;">X</button>
      </div>
    </div>
    <div id="bodyClick">
      <div id="ttl" class="ttl">Original Carbon Black &amp; 24K Gold v5.7</div>
      <div id="sub" class="sub">10s Idle Auto-Close | Zero False Red News Badges</div>
    </div>
    <div class="ftr">
      <span id="dragCue" style="color:#94A3B8;">10s Auto-Close</span>
      <span style="color:#FFD000;font-weight:900;">rentandrugshield.com</span>
    </div>
  </div>
  <script src="carbon-toast.js"></script>
</body>
</html>
