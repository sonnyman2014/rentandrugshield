    const padFreqs = [65.41, 98.00, 155.56];
    padFreqs.forEach(function(freq, i) {
      const osc = audioCtx.createOscillator();
      const flt = audioCtx.createBiquadFilter();
      const g = audioCtx.createGain();
      osc.type = i === 0 ? "sine" : "triangle";
      osc.frequency.value = freq;
      osc.detune.value = (i - 1) * 5;
      flt.type = "lowpass";
      flt.frequency.value = 420 + i * 160;
      g.gain.value = i === 0 ? 0.14 : 0.065;
      osc.connect(flt);
      flt.connect(g);
      g.connect(masterGain);
      osc.start();
    });

    nextArpTime = audioCtx.currentTime + 0.05;
  }

  function triggerChime(freqBase) {
    if (!audioCtx || isMuted || !isPlaying) return;
    const now = audioCtx.currentTime;
    [freqBase, freqBase * 1.5].forEach(function(f, idx) {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(f, now + idx * 0.05);
      g.gain.setValueAtTime(0.0001, now + idx * 0.05);
      g.gain.exponentialRampToValueAtTime(0.08, now + idx * 0.05 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.05 + 0.75);
      osc.connect(g);
      g.connect(masterGain);
      osc.start(now + idx * 0.05);
      osc.stop(now + idx * 0.05 + 0.8);
    });
  }

  function pumpSynth() {
    if (!audioCtx || isMuted || !isPlaying) return;
    const now = audioCtx.currentTime;
    while (nextArpTime < now + 0.18) {
      const freq = ARP_NOTES[arpStep % ARP_NOTES.length];
      const osc = audioCtx.createOscillator();
      const flt = audioCtx.createBiquadFilter();
      const g = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, nextArpTime);
      flt.type = "lowpass";
      flt.frequency.setValueAtTime(1400, nextArpTime);
      g.gain.setValueAtTime(0.0001, nextArpTime);
      g.gain.linearRampToValueAtTime(0.042, nextArpTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, nextArpTime + 0.24);
      osc.connect(flt);
      flt.connect(g);
      g.connect(masterGain);
      osc.start(nextArpTime);
      osc.stop(nextArpTime + 0.26);
      nextArpTime += 0.25;
      arpStep++;
    }
  }

    initAudio();

    const now = audioCtx.currentTime;

    if (!isMuted) {

    }
  }

  // ================= DRAWING PRIMITIVES =================
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function easeOutCubic(x) { const t = clamp(x, 0, 1); return 1 - Math.pow(1 - t, 3); }

  function roundRectPath(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawGlassCard(x, y, w, h, borderCol, bgAlpha, radius) {
    roundRectPath(x, y, w, h, radius || 14);
    ctx.fillStyle = "rgba(7, 17, 36, " + (bgAlpha || 0.86) + ")";
    ctx.fill();
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = borderCol;
    ctx.stroke();
  }

  function drawDiamondStar(cx, cy, outerR, innerR, color, alpha, rotRad) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotRad || 0);
    ctx.globalAlpha = clamp(alpha, 0, 1);
    const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, outerR * 1.45);
    glow.addColorStop(0, "#FFFFFF");
    glow.addColorStop(0.35, color);
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, outerR * 1.45, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#FFFFFF";
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const rad = (i % 2 === 0) ? outerR : innerR;
      const ang = (i * Math.PI) / 4;
      const px = Math.cos(ang) * rad;
      const py = Math.sin(ang) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawSolanaBars(cx, topY, width, height) {
    const barH = height * 0.24;
    const gap = (height - barH * 3) / 2;
    const slant = barH * 0.65;
    const colors = ["#00FFA3", "#00E5FF", "#3A86FF"];
    for (let i = 0; i < 3; i++) {
      const y = topY + i * (barH + gap);
      const x0 = cx - width / 2;
      const x1 = cx + width / 2;
      ctx.beginPath();
      if (i === 1) {
        ctx.moveTo(x0, y);
        ctx.lineTo(x1 - slant, y);
        ctx.lineTo(x1, y + barH);
        ctx.lineTo(x0 + slant, y + barH);
      } else {
        ctx.moveTo(x0 + slant, y);
        ctx.lineTo(x1, y);
        ctx.lineTo(x1 - slant, y + barH);
        ctx.lineTo(x0, y + barH);
      }
      ctx.closePath();
      ctx.fillStyle = colors[i];
      ctx.fill();
    }
  }

  // ================= MAIN RENDER & TIMELINE LOOP =================
  function getSceneForTime(t) {
    for (let i = 0; i < SCENES.length; i++) {
      if (t >= SCENES[i].start && (t < SCENES[i].end || i === SCENES.length - 1)) {
        return SCENES[i];
      }
    }
    return SCENES[0];
  }

  function formatTime(sec) {
    const s = clamp(sec, 0, DURATION);
    const mins = Math.floor(s / 60);
    const rem = (s % 60).toFixed(1).padStart(4, "0");
    return String(mins).padStart(2, "0") + ":" + rem;
  }

  function updateUI(scene) {
    if (!isScrubbing) {
      scrubber.value = currentTime.toFixed(2);
    }
    const pct = (currentTime / DURATION) * 100;
    scrubber.style.background = "linear-gradient(90deg, #00FFA3 0%, #00E5FF " + pct + "%, #1a2944 " + pct + "%)";
    timeReadout.textContent = formatTime(currentTime) + " / 00:45.0";
    chapterBtns.forEach(function(btn, idx) {
      btn.classList.toggle("active", idx === scene.idx);
    });
  }

  function renderAt(t) {
    const sc = getSceneForTime(t);
    drawBaseStage(t, sc);
    const localT = t - sc.start;
    if (sc.idx === 0) renderScene1(t, localT);
    else if (sc.idx === 1) renderScene2(t, localT);
    else if (sc.idx === 2) renderScene3(t, localT);
    else if (sc.idx === 3) renderScene4(t, localT);
    else renderScene5(t, localT);

    // Subtle scene transition flash
    if (localT < 0.22 && sc.idx > 0) {
      ctx.fillStyle = "rgba(0, 255, 163, " + ((1 - localT / 0.22) * 0.14) + ")";
      ctx.fillRect(0, 55, 1280, 658);
    }
    updateUI(sc);
  }

  function tick(now) {
    const dt = Math.min(0.1, Math.max(0, (now - lastFrameTs) / 1000));
    lastFrameTs = now;

    if (isPlaying && !isScrubbing) {
      currentTime += dt;
      if (currentTime >= DURATION) {
        currentTime = 0.0; // Seamless showcase loop in Tab 4
        lastSceneIdx = -1;
      }
      const sc = getSceneForTime(currentTime);
      if (sc.idx !== lastSceneIdx) {
        lastSceneIdx = sc.idx;
        triggerChime(261.63 + sc.idx * 65.4);
      }
      pumpSynth();
    }

    renderAt(currentTime);
    requestAnimationFrame(tick);
  }

  // ================= EVENT WIRING =================
  function setPlaying(playState) {
    isPlaying = playState;
    playPauseBtn.textContent = isPlaying ? "⏸ Pause" : "▶ Play";
    if (audioCtx && masterGain) {
      const now = audioCtx.currentTime;
      masterGain.gain.setTargetAtTime((!isMuted && isPlaying) ? 0.55 : 0.0, now, 0.05);
      if (isPlaying && !isMuted) {
        nextArpTime = audioCtx.currentTime + 0.04;
      }
    }
  }

  playPauseBtn.addEventListener("click", function() {
    if (isMuted && !isPlaying) setMuted(false);
    setPlaying(!isPlaying);
  });

  replayBtn.addEventListener("click", function() {
    currentTime = 0.0;
    lastSceneIdx = -1;
    setPlaying(true);
  });

  muteBtn.addEventListener("click", function() {
    setMuted(!isMuted);
  });

  soundToast.addEventListener("click", function(ev) {
    ev.stopPropagation();
    setMuted(!isMuted);
  });

  document.getElementById("canvasStage").addEventListener("click", function() {
    if (isMuted) {
      setMuted(false);
      if (!isPlaying) setPlaying(true);
    } else {
      setPlaying(!isPlaying);
    }
  });

  scrubber.addEventListener("input", function() {
    isScrubbing = true;
    currentTime = parseFloat(scrubber.value) || 0;
    renderAt(currentTime);
  });

  scrubber.addEventListener("change", function() {
    isScrubbing = false;
    currentTime = parseFloat(scrubber.value) || 0;
    lastSceneIdx = getSceneForTime(currentTime).idx;
  });

  chapterBtns.forEach(function(btn) {
    btn.addEventListener("click", function() {
      currentTime = parseFloat(btn.getAttribute("data-start")) || 0;
      lastSceneIdx = -1;
      setPlaying(true);
      renderAt(currentTime);
    });
  });

  window.addEventListener("keydown", function(ev) {
    if (ev.code === "Space") {
      ev.preventDefault();
      setPlaying(!isPlaying);
    }
  });

  renderAt(0);
  requestAnimationFrame(tick);
})();
